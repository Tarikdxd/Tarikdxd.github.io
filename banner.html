<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Tarık Tozlu — banner</title>
    <style>
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("assets/fonts/roboto-latin-ext.woff2") format("woff2");
      }
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("assets/fonts/roboto-latin.woff2") format("woff2");
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 360px; overflow: hidden; background: #000; }
      body {
        font-family: Roboto, Inter, -apple-system, "Segoe UI", sans-serif;
        color: #f2f2f4;
        -webkit-font-smoothing: antialiased;
      }
      .banner {
        position: relative;
        display: flex;
        align-items: center;
        gap: 44px;
        width: 1200px;
        height: 360px;
        padding: 0 96px 0 72px;
        background:
          radial-gradient(700px 420px at 8% 110%, rgba(37, 99, 235, 0.22), transparent 65%),
          radial-gradient(640px 380px at 92% -10%, rgba(124, 58, 237, 0.18), transparent 62%),
          #000;
      }
      .banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse at 50% 50%, #000 30%, transparent 78%);
        pointer-events: none;
      }
      .avatar-wrap {
        position: relative;
        flex-shrink: 0;
      }
      .avatar {
        display: block;
        width: 210px;
        height: 210px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #2563eb;
        box-shadow: 0 0 70px rgba(37, 99, 235, 0.38);
      }
      .dot {
        position: absolute;
        right: 10px;
        bottom: 14px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #34d399;
        border: 5px solid #000;
      }
      .copy { flex: 1; min-width: 0; }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #60a5fa;
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 12px #34d399;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 62px;
        line-height: 0.98;
        letter-spacing: -0.04em;
        font-weight: 700;
        color: #fff;
      }
      .tagline {
        margin: 0 0 20px;
        max-width: 560px;
        font-size: 17px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.62);
      }
      .bubble {
        display: inline-flex;
        align-items: center;
        padding: 9px 18px;
        border-radius: 999px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        font-weight: 500;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 292px;
        flex-shrink: 0;
      }
      .card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 12px;
        background: rgba(11, 11, 15, 0.62);
      }
      .card b { font-size: 13px; font-weight: 600; color: #f2f2f4; }
      .card span {
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 10px;
        color: rgba(255, 255, 255, 0.36);
      }
      .rail {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: 54px;
        padding: 22px 0;
        border-left: 1px solid rgba(255, 255, 255, 0.06);
      }
      .rail i {
        display: block;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .rail i:first-child { background: linear-gradient(135deg, #2563eb, #7c3aed); border: 0; }
      .watermark {
        position: absolute;
        right: 70px;
        bottom: 18px;
        font-family: ui-monospace, "SF Mono", Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.26);
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="avatar-wrap">
        <img class="avatar" src="assets/avatar.jpg" alt="" />
        <span class="dot"></span>
      </div>
      <div class="copy">
        <div class="status"><i></i> Security &amp; Privacy · Offensive Tooling</div>
        <h1>Tarık Tozlu</h1>
        <p class="tagline">
          Yetkili sızma testi ve hata avcılığı için araçlar geliştiriyorum.<br />
          Terminal ajanları · MCP · TypeScript, Python, Bun, Linux
        </p>
        <span class="bubble">Neler inşa ettin?</span>
      </div>
      <div class="cards">
        <div class="card"><b>Eschaton-Agent</b><span>v1.0.0</span></div>
        <div class="card"><b>security-headers-checker</b><span>v0.2.0</span></div>
        <div class="card"><b>eschaton-mcp</b><span>v0.2.0</span></div>
      </div>
      <div class="rail">
        <i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="watermark">tarikdxd.github.io</div>
    </div>
  </body>
</html>
